<title>Command Center</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#232833; --txt:#e6e8ee; --mut:#8b93a7;
    --blue:#4f8cff; --green:#34d399; --amber:#fbbf24; --red:#f87171;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; line-height:1.5; padding:20px; max-width:860px; margin:0 auto;}
  header{display:flex; align-items:baseline; gap:16px; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  h1{font-size:20px; font-weight:600;}
  .meta{color:var(--mut); font-size:12px; margin-left:auto;}
  nav{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  nav button{background:transparent; color:var(--mut); border:1px solid var(--line); padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer;}
  nav button.active{color:#fff; background:var(--blue); border-color:var(--blue);}
  .view{display:none;}
  .view.on{display:block;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .card h3{font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
  .card .big{font-size:26px; font-weight:700;}
  .g{color:var(--green);} .a{color:var(--amber);} .r{color:var(--red);} .b{color:var(--blue);}
  .bar{background:#1d232e; border-radius:6px; height:8px; overflow:hidden; margin-top:8px;}
  .bar>div{height:100%; background:var(--green);}
  h2.sec{font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin:20px 0 8px;}
  .item{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px;}
  .item .t{font-size:14px; cursor:pointer;}
  .item .d{display:none; margin-top:8px; font-size:13px; color:var(--mut); border-top:1px solid var(--line); padding-top:8px; white-space:pre-wrap;}
  .item.open .d{display:block;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mut); margin-right:8px;}
  .dot.top{background:var(--amber);}
  .empty{color:var(--mut); font-size:13px; padding:10px 0;}
  .faded{color:var(--mut);}
</style>
</head>
<body>
<header>
  <h1>Command Center</h1>
  <span class="meta" id="built"></span>
</header>
<nav>
  <button data-view="focus" class="active">Focus</button>
  <button data-view="tasks">Tasks</button>
  <button data-view="ideas">Ideas</button>
  <button data-view="errands">Errands</button>
</nav>

<!-- FOCUS: only what matters right now -->
<div id="view-focus" class="view on">
  <div class="cards" id="focus-cards"></div>
  <h2 class="sec">Open priorities</h2>
  <div id="focus-tasks"></div>
</div>

<!-- TASKS: all sections, collapsible -->
<div id="view-tasks" class="view">
  <div id="tasks-root"></div>
</div>

<!-- IDEAS -->
<div id="view-ideas" class="view">
  <div id="ideas-root"></div>
</div>

<!-- ERRANDS -->
<div id="view-errands" class="view">
  <div id="errands-root"></div>
</div>

<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const $ = id => document.getElementById(id);

// nav
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', e => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  ['focus','tasks','ideas','errands'].forEach(v => $('view-'+v).classList.toggle('on', v === b.dataset.view));
}));

// helpers
function bodyToLines(body){
  if (Array.isArray(body)) return body.join('\n');
  return body || '';
}
function makeItem(title, body, opts={}){
  const el = document.createElement('div');
  el.className = 'item' + (opts.open? ' open':'');
  el.innerHTML = `<span class="dot ${opts.top?'top':''}"></span><span class="t">${esc(title)}</span>` +
    (body && body.length ? `<div class="d">${esc(bodyToLines(body))}</div>` : '');
  if (body && body.length) el.querySelector('.t').addEventListener('click', () => el.classList.toggle('open'));
  return el;
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function groupInto(root, groups){
  Object.entries(groups).forEach(([sec, items])=>{
    if(!items || !items.length) return;
    const h=document.createElement('h2'); h.className='sec'; h.textContent=sec; root.appendChild(h);
    items.forEach(it=>{
      const title = typeof it === 'string' ? it : it.title;
      const body  = typeof it === 'string' ? '' : (it.body||[]);
      root.appendChild(makeItem(title, body));
    });
  });
}

// ---- FOCUS ----
function renderFocus(){
  const cards = $('focus-cards'); cards.innerHTML='';
  // open tasks count
  cards.appendChild(card('Open tasks', DATA.focus.tasks.length, 'b'));
  // ROBOWALK card
  const rw = DATA.projects.ROBOWALK;
  const pct = rw.deposits.threshold ? Math.min(100, Math.round(rw.deposits.cumulative/rw.deposits.threshold*100)) : 0;
  const el = document.createElement('div'); el.className='card';
  el.innerHTML = `<h3>ROBOWALK MTL</h3>
    <div class="big ${rw.deposits.buy_ready!=='false'&&pct>=100?'g':''}">$${rw.deposits.cumulative}</div>
    <div class="faded">of $${rw.deposits.threshold} deposit goal · ${rw.leads_won} won / ${rw.leads_active} leads</div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="faded" style="margin-top:6px;font-size:12px">${pct>=100?'✅ Buy the robot':'Cash-before: keep closing'}</div>`;
  cards.appendChild(el);
  // focus tasks
  const rt=$('focus-tasks'); rt.innerHTML='';
  const open = DATA.focus.tasks;
  DATA.focus.top.forEach(t=>{
    const match = open.find(o=>Object.keys(o)[0]===t);
    if(match){ rt.appendChild(makeItem(t, match[t], {top:true})); const i=open.indexOf(match); if(i>-1) open.splice(i,1); }
  });
  open.forEach(o=>{ const t=Object.keys(o)[0]; rt.appendChild(makeItem(t, o[t])); });
  if(!DATA.focus.tasks.length) rt.innerHTML='<div class="empty">Nothing open. Focus is clear. ✅</div>';
}
function card(title,val,cls){
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<h3>${title}</h3><div class="big ${cls}">${val}</div>`; return el;
}

// ---- TASKS (skip done), IDEAS, ERRANDS ----
function renderTasks(){ const r=$('tasks-root'); r.innerHTML=''; groupInto(r, DATA.all_tasks); if(!r.children.length) r.innerHTML='<div class="empty">All sections empty.</div>'; }
function renderIdeas(){ const r=$('ideas-root'); r.innerHTML=''; groupInto(r, DATA.ideas); if(!r.children.length) r.innerHTML='<div class="empty">No ideas captured.</div>'; }
function renderErrands(){ const r=$('errands-root'); r.innerHTML=''; groupInto(r, DATA.errands); if(!r.children.length) r.innerHTML='<div class="empty">No errands.</div>'; }

document.getElementById('built').textContent = 'updated ' + DATA.built_at;
renderFocus(); renderTasks(); renderIdeas(); renderErrands();
</script>
